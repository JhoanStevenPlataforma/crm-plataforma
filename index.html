    <title>Hermes CRM</title>

    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("RaStore.theme") || '"system"');
        if (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      /* Prevent accidental double-tap zoom on interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        touch-action: manipulation;
      }

      /* Boot screen: the HermesLoader caduceus (src/components/ui/hermes-loader.tsx)
         as static markup, because it shows before React and index.css load.
         The paths below are generated from that component's geometry, and the
         colours are its brand tokens as hex, from src/index.css. */
      .loader-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background-color: #f4f6fa;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #606878;
      }
      .dark .loader-container {
        background-color: #090d17;
        color: #959ba9;
      }
      .hermes-boot .r0 { stroke: #a0570f; }
      .hermes-boot .r1 { stroke: #f0a73a; }
      .hermes-boot .staff { stroke: #c8ceda; }
      .dark .hermes-boot .r0 { stroke: #e39a46; }
      .dark .hermes-boot .r1 { stroke: #f0a73a; }
      .dark .hermes-boot .staff { stroke: #333a4a; }
      .hermes-boot .back path { stroke-width: 3.5; stroke-opacity: 0.5; }
      .hermes-boot .front path { stroke-width: 5.5; }
      .hermes-boot .braid { animation: hermes-braid 1.6s linear infinite; }
      @keyframes hermes-braid {
        to { transform: translateY(-60px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hermes-boot .braid { animation: hermes-breathe 2.4s ease-in-out infinite; }
      }
      @keyframes hermes-breathe {
        50% { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div id="root">

              <stop offset="0.84" stop-color="#fff" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <mask id="hermes-boot-mask" maskUnits="userSpaceOnUse">
              <rect x="-10" y="0" width="60" height="120" fill="url(#hermes-boot-fade)" />
            </mask>
          </defs>

  </body>
</html>
